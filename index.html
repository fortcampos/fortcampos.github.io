<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fort_Campos | Comércio & Prestação de Serviços</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #0f294a;       /* Azul Marinho Profundo */
            --secondary: #1e4d8c;     /* Azul Corporativo */
            --accent: #f59e0b;        /* Dourado/Laranja Vibrante */
            --accent-hover: #d97706;
            --whatsapp: #25d366;
            --bg-light: #f0f5fa;      /* Fundo Suave Colorido */
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        /* Cabeçalho e Navegação */
        header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(15, 41, 74, 0.25);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .logo span {
            font-size: 0.75rem;
            display: block;
            color: #e2e8f0;
            margin-top: -4px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.8rem;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.8rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Banner Principal (Hero) */
        .hero {
            background: linear-gradient(135deg, rgba(15, 41, 74, 0.85) 0%, rgba(30, 77, 140, 0.80) 100%), 
                        url('https://unsplash.com') center/cover no-repeat;
            color: var(--white);
            padding: 7.5rem 5%;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 680px;
            margin: 0 auto 2.5rem;
            color: #f1f5f9;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.95rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: var(--white);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: var(--white);
        }

        /* Secções Gerais */
        section {
            padding: 5.5rem 5%;
        }

        .section-tag {
            color: var(--accent-hover);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.4rem;
        }

        .section-title {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        /* Sobre Nós */
        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5rem;
            align-items: center;
            background-color: var(--white);
        }

        .about-img img {
            width: 100%;
            border-radius: 18px;
            box-shadow: 0 18px 35px rgba(15, 41, 74, 0.15);
            border-bottom: 6px solid var(--accent);
            display: block;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .value-box {
            background: var(--bg-light);
            padding: 1.1rem;
            border-radius: 12px;
            border-left: 4px solid var(--secondary);
        }

        .value-box strong {
            color: var(--primary);
            display: block;
            margin-bottom: 0.25rem;
        }

        /* Serviços */
        .services {
            background-color: var(--bg-light);
            text-align: center;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            text-align: left;
        }

        .service-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 41, 74, 0.07);
            transition: transform 0.3s, border-color 0.3s;
            border-top: 5px solid var(--secondary);
            display: flex;
            flex-direction: column;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-top-color: var(--accent);
        }

        .service-card img {
            width: 100%;
            height: 195px;
            object-fit: cover;
        }

        .service-content {
            padding: 1.6rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-content h3 {
            color: var(--primary);
            margin-bottom: 0.7rem;
            font-size: 1.25rem;
        }

        .service-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }

        .service-link {
            color: var(--secondary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .service-link:hover {
            color: var(--accent-hover);
        }

        /* Por que escolher-nos */
        .why-us {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            text-align: center;
        }

        .why-us .section-title {
            color: var(--white);
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .why-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 2rem 1.5rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s;
        }

        .why-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.16);
        }

        .why-icon {
            background: var(--accent);
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 auto 1rem;
            font-size: 1.3rem;
        }

        /* Contacto */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            margin-top: 2.5rem;
        }

        .contact-info-card {
            background: var(--bg-light);
            padding: 1.25rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-left: 4px solid var(--secondary);
        }

        .contact-icon {
            font-size: 1.4rem;
            background: var(--primary);
            color: var(--white);
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        form {
            background: var(--white);
            padding: 2.2rem;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(15, 41, 74, 0.08);
            border-top: 5px solid var(--accent);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #cbd5e1;
